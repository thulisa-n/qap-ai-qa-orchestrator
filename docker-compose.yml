services:
  qap-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qap-ai-qa-engine
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    environment:
      - JOB_DB_PATH=/workspace/app/.data/jobs.db
    volumes:
      - qap_job_data:/workspace/app/.data
    restart: unless-stopped

volumes:
  qap_job_data:
